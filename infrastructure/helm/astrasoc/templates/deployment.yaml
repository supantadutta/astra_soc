apiVersion: apps/v1
kind: Deployment
metadata:
  name: astrasoc-api
  labels: { app: astrasoc-api }
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app: astrasoc-api }
  template:
    metadata:
      labels: { app: astrasoc-api }
    spec:
      containers:
        - name: api
          image: {{ .Values.api.image }}
          ports: [{ containerPort: {{ .Values.api.port }} }]
          env:
            {{- range $k, $v := .Values.api.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: ASTRASOC_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: astrasoc-secrets, key: ASTRASOC_JWT_SECRET }
          readinessProbe:
            httpGet: { path: /health, port: {{ .Values.api.port }} }
            initialDelaySeconds: 15
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: astrasoc-web
  labels: { app: astrasoc-web }
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: { app: astrasoc-web }
  template:
    metadata:
      labels: { app: astrasoc-web }
    spec:
      containers:
        - name: web
          image: {{ .Values.web.image }}
          ports: [{ containerPort: {{ .Values.web.port }} }]
          env:
            - { name: NEXT_PUBLIC_API_BASE_URL, value: {{ .Values.web.apiBaseUrl | quote }} }
---
apiVersion: v1
kind: Secret
metadata:
  name: astrasoc-secrets
type: Opaque
stringData:
  ASTRASOC_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
---
apiVersion: v1
kind: Service
metadata: { name: astrasoc-api }
spec:
  selector: { app: astrasoc-api }
  ports: [{ port: {{ .Values.api.port }}, targetPort: {{ .Values.api.port }} }]
---
apiVersion: v1
kind: Service
metadata: { name: astrasoc-web }
spec:
  selector: { app: astrasoc-web }
  ports: [{ port: {{ .Values.web.port }}, targetPort: {{ .Values.web.port }} }]
