{{- if not .Values.secrets.existingSecret }}
{{- $jwt := required "secrets.jwtSecret is required (or set secrets.existingSecret)" .Values.secrets.jwtSecret }}
{{- $audit := required "secrets.auditKey is required (or set secrets.existingSecret)" .Values.secrets.auditKey }}
{{- if eq $jwt $audit }}{{ fail "secrets.auditKey must differ from secrets.jwtSecret" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "astrasoc.secretName" . }}
  labels: {{- include "astrasoc.labels" . | nindent 4 }}
type: Opaque
stringData:
  ASTRASOC_JWT_SECRET: {{ $jwt | quote }}
  ASTRASOC_AUDIT_KEY: {{ $audit | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required with the bundled PostgreSQL" .Values.secrets.postgresPassword | quote }}
  {{- else }}
  ASTRASOC_DATABASE_URL: {{ required "secrets.databaseUrl is required when postgresql.enabled=false" .Values.secrets.databaseUrl | quote }}
  {{- end }}
  {{- with .Values.secrets.bootstrapAdminEmail }}
  ASTRASOC_BOOTSTRAP_ADMIN_EMAIL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.bootstrapAdminPassword }}
  ASTRASOC_BOOTSTRAP_ADMIN_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.vaultToken }}
  ASTRASOC_VAULT_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
