{{- if .Values.ingress.enabled }}
{{- $name := include "astrasoc.fullname" . -}}
# /api/* goes straight to the API (paths preserved, no rewrite); everything
# else to the web tier.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels: {{- include "astrasoc.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: {{ $name }}-api, port: { number: {{ .Values.api.port }} } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ $name }}-web, port: { number: {{ .Values.web.port }} } } }
{{- end }}
