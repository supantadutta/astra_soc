{{- $name := include "astrasoc.fullname" . -}}
{{- $secret := include "astrasoc.secretName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-api
  labels: {{- include "astrasoc.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # Replicas coordinate through PostgreSQL (see values.yaml).
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api }
  template:
    metadata:
      labels: {{- include "astrasoc.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: "{{ .Values.image.registry }}/{{ .Values.api.repository }}:{{ include "astrasoc.tag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: {{ .Values.api.port }} }]
          envFrom:
            - configMapRef: { name: {{ $name }}-config }
            - secretRef: { name: {{ $secret }} }
          {{- if .Values.postgresql.enabled }}
          env:
            - name: ASTRASOC_DATABASE_URL
              value: "postgresql+psycopg2://astrasoc:$(POSTGRES_PASSWORD)@{{ $name }}-postgres:5432/astrasoc"
          {{- end }}
          startupProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /api/v1/health/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            periodSeconds: 20
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
      {{- with .Values.api.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.api.affinity }}
      affinity: {{- toYaml .Values.api.affinity | nindent 8 }}
      {{- else if gt (int .Values.api.replicas) 1 }}
      affinity:  # spread replicas across nodes by default
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api }
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-api
  labels: {{- include "astrasoc.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api }
  ports: [{ name: http, port: {{ .Values.api.port }}, targetPort: http }]
{{- if gt (int .Values.api.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}-api
  labels: {{- include "astrasoc.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api }
{{- end }}
