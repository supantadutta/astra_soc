[project]
name = "astrasoc-api"
version = "0.1.0"
description = "ASTRASOC — Autonomous Security Operations & Cognitive Response Platform (API)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI Depends() in defaults is idiomatic.
# B904: routers deliberately translate service exceptions into HTTPException.
ignore = ["B008", "B904", "E501", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
