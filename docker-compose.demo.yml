# ==========================================================================
# ASTRASOC — DEMO profile
# Zero external credentials, zero enterprise infrastructure: the API (SQLite,
# simulated LLM, mock connectors, simulated telemetry generator) and the web
# command center. Demo accounts use the well-known password Demo!Pass123 —
# never expose this profile to an untrusted network.
#
#   docker compose -f docker-compose.demo.yml up --build
#   → Web  http://localhost:3000   (sign in as admin@astrasoc.io)
#   → API  http://127.0.0.1:8000/api/docs
# ==========================================================================
services:
  api:
    build:
      context: ./apps/api
    environment:
      ASTRASOC_ENVIRONMENT: demo
      ASTRASOC_DATABASE_URL: sqlite:////data/astrasoc.db
      ASTRASOC_DEFAULT_MODE: DEMO
      ASTRASOC_DEMO_SEED_ON_STARTUP: "true"
      ASTRASOC_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - astrasoc_demo_data:/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    environment:
      # Read at runtime by the /api/* proxy route inside the web container.
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  astrasoc_demo_data:
