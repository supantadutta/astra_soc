name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint & tests (SQLite + PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: astrasoc
          POSTGRES_PASSWORD: astrasoc
          POSTGRES_DB: astrasoc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U astrasoc" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: ruff check astrasoc tests
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Tests (PostgreSQL)
        env:
          ASTRASOC_TEST_DATABASE_URL: postgresql+psycopg2://astrasoc:astrasoc@localhost:5432/astrasoc_test
        run: python -m pytest -q
      - name: Migrations apply cleanly and match the models
        env:
          ASTRASOC_DATABASE_URL: postgresql+psycopg2://astrasoc:astrasoc@localhost:5432/astrasoc_migrate
        run: |
          PGPASSWORD=astrasoc psql -h localhost -U astrasoc -d astrasoc_test -c "CREATE DATABASE astrasoc_migrate"
          alembic upgrade head
          alembic check

  web:
    name: Web — typecheck, lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  images:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          tags: astrasoc-api:ci
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: false
          tags: astrasoc-web:ci
